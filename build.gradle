plugins {
    id 'application'
}

group = group
version = version

static def detectHostNatives() {
    def os = System.getProperty("os.name").toLowerCase()
    def arch = System.getProperty("os.arch").toLowerCase()

    if (os.contains("linux")) {
        if (arch.startsWith("aarch64") || arch.startsWith("arm64")) {
            return "natives-linux-arm64"
        }
        return "natives-linux"
    }

    if (os.contains("freebsd")) {
        return "natives-freebsd"
    }

    if (os.contains("mac")) {
        if (arch.startsWith("aarch64") || arch.startsWith("arm64")) {
            return "natives-macos-arm64"
        }
        return "natives-macos"
    }

    if (os.contains("windows")) {
        if (arch.startsWith("aarch64") || arch.startsWith("arm64")) {
            return "natives-windows-arm64"
        }
        return "natives-windows"
    }

    throw new GradleException("Unsupported host OS: ${os}")
}

def lwjglNatives = providers.gradleProperty("lwjglNatives").getOrElse(detectHostNatives())
def targetPlatform = providers.gradleProperty("targetPlatform").getOrElse("local")

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-vulkan"
    implementation "org.lwjgl:lwjgl-assimp"
    implementation "org.lwjgl:lwjgl-shaderc"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-vma"

    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-assimp::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-shaderc::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-vma::${lwjglNatives}"

    implementation "org.joml:joml:1.10.8"

    implementation project(':core')
    implementation project(':window-glfw')
    implementation project(':render-opengl')

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

application {
    mainClass = 'com.restonic4.unlock.Unlock'
}

tasks.named("distZip", Zip) {
    archiveFileName = "${project.name}-${project.version}-${targetPlatform}.zip"
}

tasks.register('renderdoc', Exec) {
    group = 'application'
    description = 'Launches Unlock under RenderDoc using XWayland.'

    dependsOn tasks.named('classes')

    def javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath

    def appClasspath = sourceSets.main.runtimeClasspath.asPath
    def entryPoint = application.mainClass.get()

    def captureDir = layout.buildDirectory.dir('renderdoc').get().asFile
    def capturePath = new File(captureDir, 'unlock').absolutePath

    workingDir projectDir

    // Use the X11/XWayland environment for the launched application.
    environment 'XDG_SESSION_TYPE', 'x11'

    doFirst {
        if (!captureDir.exists() && !captureDir.mkdirs()) {
            throw new GradleException("Could not create RenderDoc directory: ${captureDir}")
        }

        // Start RenderDoc's GUI with Qt's X11 backend.
        try {
            def gui = new ProcessBuilder('qrenderdoc')
            gui.directory(projectDir)
            gui.environment().put('XDG_SESSION_TYPE', 'x11')
            gui.environment().put('QT_QPA_PLATFORM', 'xcb')
            gui.start()
        } catch (Exception e) {
            throw new GradleException('Could not launch qrenderdoc. Install RenderDoc.', e)
        }

        logger.lifecycle("Launching ${entryPoint} under RenderDoc")
        logger.lifecycle("Capture directory: ${captureDir}")
    }

    commandLine(
            'renderdoccmd',
            'capture',
            '--wait-for-exit',
            '--working-dir', projectDir.absolutePath,
            '--capture-file', capturePath,
            javaExecutable,
            '-Dengine.windowing=x11',
            '-cp', appClasspath,
            entryPoint
    )
}