plugins {
    id 'bloom.java-library'
    id 'bloom.publishing'
}

group = 'com.restonic4.bloom'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-proc:none']
}

mavenPublishing {
    coordinates(project.group.toString(), 'events', project.version.toString())

    pom {
        name = 'BloomEvents'
        description = 'Event system extracted from the Bloom game engine.'
    }
}
