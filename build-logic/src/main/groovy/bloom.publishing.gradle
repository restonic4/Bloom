plugins {
    id 'signing'
    id 'com.vanniktech.maven.publish'
}

signing {
    useGpgCmd()
}

// Only Maven Central needs signed artifacts; publishToMavenLocal works without a GPG key
tasks.withType(Sign).configureEach {
    onlyIf { gradle.taskGraph.allTasks.any { it.name.contains("MavenCentral") } }
}

mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()

    // Every module publishes as bloom-<module>; set the version in the module's gradle.properties if it has its own line
    coordinates(project.group.toString(), "bloom-${project.name}".toString(), project.version.toString())

    pom {
        url = 'https://github.com/restonic4/Bloom'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/license/mit/'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'restonic4'
                name = 'restonic4'
                url = 'https://github.com/restonic4'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/restonic4/Bloom.git'
            developerConnection = 'scm:git:ssh://git@github.com/restonic4/Bloom.git'
            url = 'https://github.com/restonic4/Bloom'
        }
    }
}
