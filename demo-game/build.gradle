plugins {
    id 'bloom.java-library'
    id 'bloom.lwjgl-natives'
    id 'application'
}

def targetPlatform = providers.gradleProperty("targetPlatform").getOrElse("local")

dependencies {
    // Same setup as a game that uses the published artifacts: the BOM sets every version
    implementation platform(project(':bom'))

    implementation project(':core')
    implementation project(':window-glfw')
    implementation project(':render-opengl')
    implementation project(':render-vulkan')
    implementation project(':assets')

    // OpenGlTest and VulkanTest still call LWJGL directly
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-vulkan"

    runtimeOnly lwjglNative("lwjgl")
    runtimeOnly lwjglNative("lwjgl-glfw")
    runtimeOnly lwjglNative("lwjgl-opengl")
    runtimeOnly lwjglNative("lwjgl-assimp")
    runtimeOnly lwjglNative("lwjgl-shaderc")
    runtimeOnly lwjglNative("lwjgl-stb")
    runtimeOnly lwjglNative("lwjgl-vma")
}

application {
    mainClass = 'com.restonic4.unlock.Unlock'
}

tasks.named("distZip", Zip) {
    archiveFileName = "${project.name}-${project.version}-${targetPlatform}.zip"
}

tasks.register('renderdoc', Exec) {
    group = 'application'
    description = 'Launches Unlock under RenderDoc using XWayland.'

    dependsOn tasks.named('classes')

    def javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath

    def appClasspath = sourceSets.main.runtimeClasspath.asPath
    def entryPoint = application.mainClass.get()

    def captureDir = layout.buildDirectory.dir('renderdoc').get().asFile
    def capturePath = new File(captureDir, 'unlock').absolutePath

    workingDir projectDir

    // Use the X11/XWayland environment for the launched application.
    environment 'XDG_SESSION_TYPE', 'x11'

    doFirst {
        if (!captureDir.exists() && !captureDir.mkdirs()) {
            throw new GradleException("Could not create RenderDoc directory: ${captureDir}")
        }

        // Start RenderDoc's GUI with Qt's X11 backend.
        try {
            def gui = new ProcessBuilder('qrenderdoc')
            gui.directory(projectDir)
            gui.environment().put('XDG_SESSION_TYPE', 'x11')
            gui.environment().put('QT_QPA_PLATFORM', 'xcb')
            gui.start()
        } catch (Exception e) {
            throw new GradleException('Could not launch qrenderdoc. Install RenderDoc.', e)
        }

        logger.lifecycle("Launching ${entryPoint} under RenderDoc")
        logger.lifecycle("Capture directory: ${captureDir}")
    }

    commandLine(
            'renderdoccmd',
            'capture',
            '--wait-for-exit',
            '--working-dir', projectDir.absolutePath,
            '--capture-file', capturePath,
            javaExecutable,
            '-Dengine.windowing=x11',
            '-cp', appClasspath,
            entryPoint
    )
}