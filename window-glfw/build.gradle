plugins {
    id 'bloom.java-library'
    id 'bloom.publishing'
}

dependencies {
    api project(':core')

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
}

mavenPublishing {
    pom {
        name = 'Bloom window-glfw'
        description = 'GLFW window and input backend for the Bloom game engine.'
    }
}
