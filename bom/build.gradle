plugins {
    id 'java-platform'
    id 'bloom.publishing'
}

// Every module has its own version line; this BOM pairs the ones that work together
def modules = [
        'events'       : 'bloom-events',
        'core'         : 'bloom-core',
        'assets'       : 'bloom-assets',
        'window-glfw'  : 'bloom-window-glfw',
        'render-opengl': 'bloom-render-opengl',
        'render-vulkan': 'bloom-render-vulkan',
]
modules.keySet().each { evaluationDependsOn(":${it}") }

javaPlatform {
    allowDependencies()
}

dependencies {
    // Imports LWJGL's own BOM, so users add LWJGL natives without a version
    api platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")

    constraints {
        modules.each { path, artifact ->
            api "${group}:${artifact}:${project(":${path}").version}"
        }
    }
}

mavenPublishing {
    coordinates(project.group.toString(), 'bloom-bom', project.version.toString())

    pom {
        name = 'Bloom BOM'
        description = 'Bill of materials for the Bloom game engine. Pins every Bloom module and LWJGL to matching versions.'
    }
}
